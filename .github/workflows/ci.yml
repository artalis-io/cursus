name: Cursus CI

# The application remains on the existing Node/TypeScript stack. OTTO is
# checked out as a source dependency but the data-independent suites do not
# require confidential datasets or prebuilt engine artifacts.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cloudflare HA unit tests (credential-free)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile deployment CLIs
        run: python3 -m py_compile deploy/ha.py deploy/stateful.py deploy/cutover.py

  stateful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Start isolated PostgreSQL and S3 protocol fixture
        run: docker compose -p cursus-ci-stateful -f compose.integration.yaml up -d --wait
      - name: Stateful concurrency and recovery integration tests
        working-directory: server
        env:
          CURSUS_TEST_DATABASE_URL: postgres://cursus:integration-only@127.0.0.1:55432/cursus
          CURSUS_TEST_S3_ENDPOINT: http://127.0.0.1:59000
        run: npm run test:stateful
      - name: Stop integration environment
        if: always()
        run: docker compose -p cursus-ci-stateful -f compose.integration.yaml down -v

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (data-independent)
        run: npm run test:ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
