name: Cursus CI

# The application remains on the existing Node/TypeScript stack. OTTO is
# checked out as a source dependency but the data-independent suites do not
# require confidential datasets or prebuilt engine artifacts.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Production image, two replicas, real authentication and native solves
        run: python3 deploy/acceptance.py --report /tmp/cursus-acceptance-evidence/report.json
      - name: Preserve acceptance evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-acceptance-evidence
          path: |
            /tmp/cursus-acceptance-evidence/
            web/test-results/
          retention-days: 14

  release:
    if: always()
    needs: [ha, stateful, server, web, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed: raise SystemExit('Release blocked by: ' + ', '.join(failed))
          print('All release checks passed')
          PY

  ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cloudflare HA unit tests (credential-free)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile deployment CLIs
        run: >-
          python3 -m py_compile deploy/ha.py deploy/stateful.py deploy/cutover.py
          deploy/recovery-adapter.py deploy/migration-source.py deploy/migration-adapter.py
          deploy/boot-recover.py deploy/recovery.py

  stateful:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build pinned native Surge using OTTO machinery
        working-directory: vendor/otto
        run: make -C shared lib && make -C arbor lib && make -C surge surge_solve
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Native retained assignments, constraints and ID regression tests
        working-directory: server
        env:
          CURSUS_TEST_SURGE_BIN: ${{ github.workspace }}/vendor/otto/surge/surge_solve
        run: node --import tsx --test src/plan/retained.test.ts src/plan/access.test.ts src/state/solver-ids.test.ts
      - name: Start isolated PostgreSQL and S3 protocol fixture
        run: docker compose -p cursus-ci-stateful -f compose.integration.yaml up -d --wait
      - name: Stateful concurrency and recovery integration tests
        working-directory: server
        env:
          CURSUS_TEST_DATABASE_URL: postgres://cursus:integration-only@127.0.0.1:55432/cursus
          CURSUS_TEST_S3_ENDPOINT: http://127.0.0.1:59000
          CURSUS_TEST_SURGE_BIN: ${{ github.workspace }}/vendor/otto/surge/surge_solve
        run: npm run test:stateful
      - name: Stop integration environment
        if: always()
        run: docker compose -p cursus-ci-stateful -f compose.integration.yaml down -v

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (data-independent)
        run: npm run test:ci
      - name: Manual planning command coverage (compiled production module)
        run: npm run test:manual:coverage

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
