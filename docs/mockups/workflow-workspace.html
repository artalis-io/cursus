  <div class="card"><h2 data-en="Coverage & constraint evidence" data-hu="Kiszolgálás és korlátozások"></h2><div class="row"><div><b id="review-coverage"></b><small data-en="Delivery identity, not just reference counts" data-hu="Kiszállítás-azonosító alapján, nem csak hivatkozásszámmal"></small></div><button class="link" data-switch="plan" data-en="Inspect in Plan" data-hu="Megtekintés a Tervezésben"></button></div><ul class="checklist"><li data-en="GVW, tail-lift, payload and time-window evidence remain separate checks." data-hu="Az össztömeg, emelőhátfal, kapacitás és időablak külön ellenőrzés marad."></li><li data-en="Locked routes and retained manual decisions must match this exact revision." data-hu="A zárolt útvonalaknak és kézi döntéseknek ehhez a pontos verzióhoz kell tartozniuk."></li><li data-en="Exceptions remain visible with their original reasons and approval evidence." data-hu="A kivételek eredeti indokai és jóváhagyási adatai láthatók maradnak."></li></ul><button data-note data-en="Open detailed issues" data-hu="Részletes problémák megnyitása"></button></div>
  <div class="card"><h2 data-en="Comparison is explicit" data-hu="Kifejezett összehasonlítás"></h2><p data-en="Choose a compatible saved reference plan. No original or handmade plan is required. Service loss or incompatible inputs prevent efficiency-savings claims." data-hu="Válasszon kompatibilis mentett referenciatervet. Eredeti vagy kézzel készített terv nem szükséges. Kisebb kiszolgálás vagy eltérő bemenet mellett nem állítható hatékonysági megtakarítás."></p><button style="margin-top:12px" data-note data-en="Choose comparison reference…" data-hu="Referenciaterv kiválasztása…"></button></div>
 </div><div><div class="card"><h2 data-en="Review & approval" data-hu="Ellenőrzés és jóváhagyás"></h2><p id="approval-explanation"></p><p class="notice" data-en="Opening this view is not a review or approval. The application retains explicit acknowledgement and server-side revision checks." data-hu="A nézet megnyitása nem jelent ellenőrzést vagy jóváhagyást. Megmarad a kifejezett nyilatkozat és a szerveroldali verzióellenőrzés."></p></div><div class="card"><h2 data-en="Exports & handoff" data-hu="Export és átadás"></h2><button data-note data-en="Ordinary export options…" data-hu="Általános exportlehetőségek…"></button><p style="margin-top:12px" data-en="Draft exports stay available and clearly labeled. Approved exports are rechecked server-side." data-hu="A munkaterv exportja továbbra is elérhető, egyértelmű címkével. A jóváhagyott exportot a szerver újra ellenőrzi."></p><p class="notice" data-en="No receiver configured in this example. Handoff requires its own explicit confirmation. Approval is not dispatch." data-hu="Ebben a példában nincs beállított fogadó. Az átadás külön megerősítést igényel. A jóváhagyás nem jelent kiküldést."></p></div></div></div></section>
</main>
<div id="message" role="status" hidden></div>
<footer class="account"><span class="avatar" aria-hidden="true">EU</span><span>example.user@example.test</span><span id="effective-role"></span><span class="build" data-en="Design prototype · no production build" data-hu="Látványterv · nem éles build"></span><button data-note data-en="Sign out" data-hu="Kijelentkezés"></button></footer>
<script>
let language='en',view='plan';
const byId=id=>document.getElementById(id),copy=(en,hu)=>language==='hu'?hu:en;
function notice(){const message=byId('message');message.hidden=false;message.textContent=copy('Prototype only. In the application this opens the existing workflow with its permissions and confirmations. Nothing was submitted.','Csak látványterv. Az alkalmazásban a meglévő folyamat nyílna meg, jogosultságokkal és megerősítéssel. Semmi nem került végrehajtásra.');}
function render(){
 document.documentElement.lang=language;
 document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[language]);
 byId('language').textContent=language==='en'?'HU':'EN';
 const state=byId('state').value,role=byId('role').value,readOnly=role==='Reviewer'||state==='archived',incomplete=state==='blocked'||state==='candidate',stale=state==='pending'||state==='archived';
 const approval=state==='approved'?copy('Approved','Jóváhagyott'):state==='reviewed'?copy('Reviewed · not approved','Ellenőrzött · nem jóváhagyott'):state==='archived'?copy('Superseded','Elavult'):copy('Draft','Tervezet');
 byId('coverage').textContent=incomplete?copy('Coverage: 118/120 · 2 unassigned','Kiszolgálás: 118/120 · 2 kiosztatlan'):copy('Coverage: 120/120','Kiszolgálás: 120/120');
 byId('coverage').className='pill '+(incomplete?'warn':'ok');
 byId('constraints').textContent=stale?copy('Constraint evidence: historical','Korlátozások: korábbi eredmény'):copy('Constraints: checked','Korlátozások: ellenőrizve');byId('constraints').className='pill '+(stale?'warn':'ok');
 byId('identity-detail').textContent=state==='pending'?copy('Saved plan illustrative-11 · plan revision 11 / scenario revision 12 · synthetic example','Mentett terv: illustrative-11 · tervverzió 11 / forgatókönyv-verzió 12 · szintetikus példa'):copy('Plan illustrative-12 · scenario revision 12 · synthetic example','Terv: illustrative-12 · forgatókönyv-verzió: 12 · szintetikus példa');
 byId('freshness').textContent=stale?(state==='archived'?copy('Previous input cycle','Korábbi adatciklus'):copy('Pending edits · saved metrics','Függő módosítások · mentett mutatók')):copy('Current revision','Aktuális verzió');
 byId('freshness').className='pill '+(stale?'warn':'ok');byId('approval').textContent=approval;byId('approval').className='pill '+(state==='approved'?'ok':'');
 byId('read-only').hidden=!readOnly;byId('effective-role').textContent=role;
 document.querySelectorAll('[data-edit]').forEach(el=>{el.disabled=readOnly;el.title=readOnly?copy('Read-only access.','Csak olvasható hozzáférés.'):'';});
 document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===view)));
 ['prepare','plan','review'].forEach(id=>byId(id).hidden=id!==view);
 byId('served').textContent=incomplete?'118 / 120':'120 / 120';byId('unassigned').textContent=incomplete?copy('Unassigned orders · 2','Kiosztatlan rendelések · 2'):copy('Unassigned orders · 0','Kiosztatlan rendelések · 0');
 byId('review-coverage').textContent=byId('coverage').textContent;byId('candidate').hidden=state!=='candidate';
 const titles={prepare:[copy('Prepare trusted inputs','Ellenőrzött bemenetek előkészítése'),copy('Inputs, profiles, constraints and source evidence.','Bemenetek, profilok, korlátozások és forrástények.')],plan:[copy('Build and refine the plan','Terv készítése és finomítása'),copy('Routes and assignments stay central. Saved metrics remain authoritative.','Az útvonalak és kiosztások állnak a középpontban. A mentett mutatók mérvadók.')],review:[copy('Review the exact selected result','A pontosan kiválasztott eredmény ellenőrzése'),copy('Coverage, freshness, approval and handoff are separate decisions.','A kiszolgálás, aktualitás, jóváhagyás és átadás külön döntések.')]};
 byId('view-title').textContent=titles[view][0];byId('view-description').textContent=titles[view][1];
 const primary=byId('primary-action'),secondary=byId('secondary-action');primary.disabled=false;primary.onclick=notice;secondary.onclick=notice;
 if(view==='prepare'){primary.textContent=copy('Open planning workspace','Tervezés megnyitása');primary.onclick=()=>switchView('plan');secondary.textContent=copy('Upload input…','Bemenet feltöltése…');secondary.disabled=readOnly;}
 if(view==='plan'){primary.textContent=readOnly?copy('Read-only plan','Csak olvasható terv'):state==='candidate'?copy('Review candidate','Jelölt ellenőrzése'):state==='pending'?copy('Review pending edits','Függő módosítások'):copy('Replan','Újratervezés');primary.disabled=readOnly;secondary.textContent=copy('Solve settings ▾','Optimalizálás beállításai ▾');secondary.disabled=readOnly;}
 if(view==='review'){primary.textContent=state==='archived'?copy('Open updated inputs','Frissített adatok megnyitása'):incomplete?(readOnly?copy('Inspect 2 unassigned','2 kiosztatlan tétel megtekintése'):copy('Resolve 2 unassigned','2 kiosztatlan tétel javítása')):stale?copy('Inspect pending edits','Függő módosítások'):state==='approved'?copy('Approved export options…','Jóváhagyott export…'):state==='reviewed'?(role==='Admin'?copy('Approve plan…','Terv jóváhagyása…'):copy('Awaiting Admin approval','Admin-jóváhagyásra vár')):role==='Reviewer'?copy('Inspect plan evidence','Tervadatok megtekintése'):copy('Review plan…','Terv ellenőrzése…');primary.disabled=state==='reviewed'&&role!=='Admin';secondary.disabled=false;secondary.textContent=copy('Ordinary exports ▾','Általános exportok ▾');if(incomplete||state==='pending')primary.onclick=()=>switchView('plan');}
 byId('approval-explanation').textContent=approval+' · '+copy('Bound to the exact plan and scenario revision.','A pontos tervhez és forgatókönyv-verzióhoz kötött.');
 const critical=byId('critical');critical.hidden=!['pending','candidate','archived'].includes(state)||(state==='candidate'&&view==='plan');byId('critical-copy').textContent=state==='pending'?copy('Pending edits: the saved plan no longer matches all current instructions.','Függő módosítások: a mentett terv már nem felel meg minden aktuális utasításnak.'):state==='candidate'?copy('A new candidate is waiting. Viewing it does not select or approve it.','Új jelölt vár döntésre. Megtekintése nem választja ki és nem hagyja jóvá.'):copy('This input cycle is superseded and read-only. Its immutable history is retained.','Ez az adatciklus már csak olvasható. Változatlan előzményei megmaradnak.');
 byId('critical-action').textContent=state==='archived'?copy('Open updated inputs','Frissített adatok'):copy('Return to Plan','Vissza a tervezéshez');byId('critical-action').onclick=state==='archived'?notice:()=>switchView('plan');
 byId('state').setAttribute('aria-label',copy('Example state','Példaállapot'));byId('role').setAttribute('aria-label',copy('Role','Szerepkör'));
}
function switchView(next){view=next;byId('message').hidden=true;render();}
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>switchView(el.dataset.view));document.querySelectorAll('[data-switch]').forEach(el=>el.onclick=()=>switchView(el.dataset.switch));document.querySelectorAll('[data-note]').forEach(el=>el.onclick=notice);
byId('state').onchange=()=>{byId('message').hidden=true;render();};byId('role').onchange=render;byId('language').onclick=()=>{language=language==='en'?'hu':'en';byId('message').hidden=true;render();};
byId('library').onclick=()=>{const list=byId('library-list');list.hidden=!list.hidden;byId('library').setAttribute('aria-expanded',String(!list.hidden));};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){byId('library-list').hidden=true;byId('library').setAttribute('aria-expanded','false');}});
render();
</script>
</body>
</html>
