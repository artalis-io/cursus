name: cursus-integration

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: cursus
      POSTGRES_USER: cursus
      POSTGRES_PASSWORD: integration-only
    ports: ["127.0.0.1:${CURSUS_TEST_POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cursus -d cursus"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]

  s3-test:
    init: true
    # Test-only S3 protocol fixture. Production is Cloudflare R2.
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -dir=/data
    ports: ["127.0.0.1:${CURSUS_TEST_S3_PORT:-59000}:8333"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/]
      interval: 2s
      timeout: 2s
      retries: 30
    # SeaweedFS reserves large extents even for tiny objects. A RAM-backed
    # directory pins those pages and can starve unrelated local map services.
    # This named volume is project-scoped and removed by test teardown (-v).
    volumes: [s3-test-data:/data]

volumes:
  s3-test-data: {}
